# Builds the signed Android APK for a release tag and attaches it to the
# GitHub release; the app finds it there when it checks for updates.
#
# Repository secrets:
#   ANDROID_KEYSTORE_BASE64    the release keystore, base64-encoded
#   ANDROID_KEYSTORE_PASSWORD  its password (also used for the key)
#   ANDROID_KEY_ALIAS          the key alias ("belka")
#   BELKA_GOOGLE_CLIENT_ID, BELKA_GOOGLE_CLIENT_SECRET, BELKA_YANDEX_CLIENT_ID
#                              built-in OAuth apps (optional)
name: Android

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    uses: ./.github/workflows/ci.yml

  apk:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: gui/package-lock.json

      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: 21

      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
          targets: aarch64-linux-android

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2

      - name: Install frontend dependencies
        working-directory: gui
        run: npm ci

      - name: Decode the release keystore
        env:
          KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE" | base64 -d > "$RUNNER_TEMP/belka-release.jks"
          echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/belka-release.jks" >> "$GITHUB_ENV"

      - name: Build the APK
        working-directory: gui
        env:
          NDK_HOME: ${{ env.ANDROID_NDK_LATEST_HOME }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          BELKA_GOOGLE_CLIENT_ID: ${{ secrets.BELKA_GOOGLE_CLIENT_ID }}
          BELKA_GOOGLE_CLIENT_SECRET: ${{ secrets.BELKA_GOOGLE_CLIENT_SECRET }}
          BELKA_YANDEX_CLIENT_ID: ${{ secrets.BELKA_YANDEX_CLIENT_ID }}
        run: npm run tauri -- android build --apk --split-per-abi --target aarch64

      - name: Name the APK by version
        run: |
          version=$(node -p "require('./gui/package.json').version")
          mkdir -p dist
          cp gui/src-tauri/gen/android/app/build/outputs/apk/arm64/release/app-arm64-release.apk \
            "dist/belka-$version-arm64.apk"

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: belka-android
          path: dist/*.apk

      - name: Attach to the release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          files: dist/*.apk
