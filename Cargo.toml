[workspace]
resolver = "2"
members = ["crates/core", "crates/store", "crates/cli", "gui/src-tauri"]
default-members = ["crates/cli"]

[workspace.package]
version = "1.1.1"
edition = "2021"
rust-version = "1.80"
authors = ["Belka Team"]

[workspace.dependencies]
belka-core = { path = "crates/core" }
belka-store = { path = "crates/store" }
tokio = { version = "1.38", features = ["macros", "rt-multi-thread", "fs", "io-util", "time", "signal"] }
# TLS is chosen per platform in crates/core.
reqwest = { version = "0.12", default-features = false, features = ["json", "stream"] }
bytes = "1"
async-trait = "0.1"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tracing = "0.1"
anyhow = "1.0"
chrono = { version = "0.4", features = ["serde"] }
url = "2.5"
percent-encoding = "2.3"
futures-util = "0.3"

# Key derivation (scrypt) is far too slow without optimizations.
[profile.dev.package.scrypt]
opt-level = 3
[profile.dev.package.salsa20]
opt-level = 3

[profile.release]
codegen-units = 1
lto = "fat"
opt-level = "z"
panic = "abort"
strip = true
