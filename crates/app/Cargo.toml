[package]
name = "belka-app"
description = "Shared application logic for Belka GUIs"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true

[features]
# Desktop Recycle Bin support via `trash`.
trash = ["dep:trash"]

[dependencies]
belka-core.workspace = true
belka-store.workspace = true
anyhow.workspace = true
bytes.workspace = true
chrono.workspace = true
encoding_rs = "0.8"
futures-util.workspace = true
getrandom = "0.3"
reqwest.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio = { workspace = true, features = ["sync", "time", "rt-multi-thread", "net", "io-util"] }
tracing.workspace = true
trash = { version = "5", optional = true }

[dev-dependencies]
tempfile = "3"
async-trait.workspace = true
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
