[package]
name = "belka-gui"
description = "Desktop file manager for cloud storage"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true

[lib]
# The `_lib` suffix keeps the lib name distinct from the bin name, see
# https://github.com/rust-lang/cargo/issues/8519
name = "belka_gui_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
belka-core.workspace = true
belka-store.workspace = true
anyhow.workspace = true
serde.workspace = true
serde_json.workspace = true
tracing.workspace = true
tracing-subscriber = { version = "0.3", default-features = false, features = ["std", "fmt", "ansi", "tracing-log"] }
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
tauri-plugin-clipboard-manager = "2"
tauri-plugin-fs = "2"
reqwest.workspace = true
bytes.workspace = true
tokio = { workspace = true, features = ["sync", "time", "rt-multi-thread", "net", "io-util"] }
getrandom = "0.3"
chrono.workspace = true
futures-util.workspace = true
encoding_rs = "0.8"

# Background backups are started by WorkManager through JNI.
[target.'cfg(target_os = "android")'.dependencies]
jni = "0.21"

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-window-state = "2"
trash = "5"
belka-store = { workspace = true, features = ["keyring"] }

# The program a file type opens with, to give it a stream.
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_UI_Shell"] }

[dev-dependencies]
tempfile = "3"
async-trait.workspace = true
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
